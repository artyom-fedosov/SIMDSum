name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # `import std;` needs CMake 4.3, GCC >= 15 / Clang >= 18.1.2 and a working libstdc++.modules.json,
    # which Ubuntu < 26.04 does not ship; Fedora provides all of it.
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc / Release, config: Release, cxx: g++ }
          - { name: gcc / Debug, config: Debug, cxx: g++ }
          - { name: gcc / Sanitize, config: Sanitize, cxx: g++ }
          - { name: clang / Release, config: Release, cxx: clang++ }
          - { name: clang / Sanitize, config: Sanitize, cxx: clang++ }

    steps:
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False git cmake ninja-build gcc-c++ clang clang-tools-extra \
            libasan libubsan compiler-rt

      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          cmake --version
          ${{ matrix.cxx }} --version
          grep -o -w -E 'sse2|avx2|avx512f|avx512bw' /proc/cpuinfo | sort -u

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          case "${{ matrix.config }}" in
            Sanitize) extra="-DCMAKE_BUILD_TYPE=Debug -DSIMDSUM_SANITIZE=ON" ;;
            Debug)    extra="-DCMAKE_BUILD_TYPE=Debug" ;;
            *)        extra="-DCMAKE_BUILD_TYPE=Release -DSIMDSUM_BUILD_BENCHMARKS=ON" ;;
          esac
          cmake -G Ninja -Wno-dev -S . -B build $extra

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install and build an external consumer
        if: matrix.config == 'Release'
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 4.3)
          set(CMAKE_EXPERIMENTAL_CXX_IMPORT_STD "451f2fe2-a8a2-47c3-bc32-94786d8fc91b")
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          find_package(simdsum REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE simdsum::simdsum)
          EOF
          cat > "$RUNNER_TEMP/consumer/main.cpp" <<'EOF'
          #include <cstdio>
          #include <vector>
          import simdsum;
          int main()
          {
              const std::vector<int> a{1, 2, 3};
              const std::vector<int> b{10, 20, 30};
              const auto r = simdsum::add(a, b);
              std::printf("%.*s\n", static_cast<int>(simdsum::to_string(simdsum::active_isa()).size()),
                          simdsum::to_string(simdsum::active_isa()).data());
              return (r == std::vector<int>{11, 22, 33}) ? 0 : 1;
          }
          EOF
          cmake -G Ninja -Wno-dev -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/consumer/build"
          LD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib:$RUNNER_TEMP/prefix/lib64" "$RUNNER_TEMP/consumer/build/consumer"

      - name: Benchmark smoke run
        if: matrix.config == 'Release'
        run: ./build/bench/simdsum_bench --benchmark_min_time=0.05s --benchmark_filter='/1024$'
